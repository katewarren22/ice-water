<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Staff Login | Ice Springs</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body>
<div class="login-bg"><div class="container"><div class="row justify-content-center"><div class="col-md-5"><div class="card p-4 rounded-4 shadow text-center">
<img src="logo.png" style="width:100px; border-radius:12px; margin:0 auto;">
<h3 class="fw-bold mt-2">ICE <span class="text-primary">SPRINGS</span></h3>
<p class="text-muted">Staff / Admin Login</p>
<form onsubmit="login(event)" class="text-start">
  <label class="form-label">Username</label><input id="user" type="text" class="form-control mb-3" placeholder="e.g. admin" required>
  <label class="form-label">Password</label><input id="pass" type="password" class="form-control mb-3" placeholder="••••••••" required>
  <button class="btn btn-blue w-100">Login <span id="spinner" class="spinner-border spinner-border-sm d-none"></span></button>
  <p class="text-center mt-3 small text-muted">Demo: Username: <b>admin</b> | Password: <b>1234</b></p>
  <p class="text-center"><a href="index.html">← Back to Website</a></p>
</form>
</div></div></div></div></div>
<script>
function login(e){ e.preventDefault();
  document.getElementById('spinner').classList.remove('d-none');
  setTimeout(function(){
    if(document.getElementById('user').value==='admin' && document.getElementById('pass').value==='1234'){
      window.location.href='admin.html';
    } else { alert('Wrong username or password. Try admin / 1234'); document.getElementById('spinner').classList.add('d-none'); }
  },1000);
}
</script>
</body></html>
